name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Paths must match sibling layout: ../velinstyle + ../velinstyle-site
      # (site package.json build uses `cd ../velinstyle` then `cd ../velinstyle-site`).
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: velinstyle-site

      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          repository: SkyliteDesign/velinstyle
          path: velinstyle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: velinstyle/package-lock.json

      - name: Install framework dependencies
        run: npm ci
        working-directory: velinstyle

      - name: Build site (framework + docs + search index)
        run: npm run build
        working-directory: velinstyle-site

      - name: Verify Velin-Meta artifacts
        run: |
          test -f velinstyle-site/dist/velin-agent.json
          test -f velinstyle-site/dist/llms.txt
          node -e "JSON.parse(require('fs').readFileSync('velinstyle-site/dist/velin-agent.json','utf8'))"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: velinstyle-site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
