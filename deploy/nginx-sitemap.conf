# Include in your nginx server { } block for velinstyle.info
# Ensures Google Search Console reads sitemaps as XML (not HTML error pages).

location = /sitemap.xml {
    types { }
    default_type application/xml;
    charset utf-8;
}

location = /sitemap-index.xml {
    types { }
    default_type application/xml;
    charset utf-8;
}

location ^~ /sitemaps/ {
    types { }
    default_type application/xml;
    charset utf-8;
}
